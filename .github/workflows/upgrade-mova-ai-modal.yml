name: Upgrade MOVA AI popup

on:
  push:
    paths:
      - '.github/workflows/upgrade-mova-ai-modal.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade MOVA AI interface and research fallback
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # ---------------- index.html ----------------
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''<style id="mova-ask-ai-tools-css">
.mova-ask-ai-tools{margin:0 0 24px!important;padding:0!important;border:0!important;border-radius:0!important;background:none!important;box-shadow:none!important}
.mova-ask-ai-tools .mova-ask-title{margin:0 0 11px!important;font-size:26px!important;line-height:1.15!important;font-weight:850!important;letter-spacing:-.02em!important}
.mova-ai-launch-form{display:grid!important;grid-template-columns:minmax(0,1fr) 58px!important;gap:10px!important;align-items:stretch!important;margin:0!important}
.mova-ai-launch-form input{display:block!important;width:100%!important;height:58px!important;min-height:58px!important;margin:0!important;padding:0 17px!important;border:1px solid rgba(98,200,255,.42)!important;border-radius:16px!important;background:#071521!important;color:#fff!important;font:inherit!important;font-size:14px!important;line-height:58px!important;outline:none!important;box-shadow:none!important}
.mova-ai-launch-form input::placeholder{color:#7f96a9!important;opacity:1!important}.mova-ai-launch-form input:focus{border-color:rgba(98,200,255,.82)!important;box-shadow:0 0 0 3px rgba(98,200,255,.07)!important}
.mova-ai-launch-icon{position:relative!important;display:grid!important;place-items:center!important;width:58px!important;height:58px!important;border:1px solid rgba(98,200,255,.5)!important;border-radius:16px!important;background:linear-gradient(145deg,#0b2940,#0a1724)!important;color:#72d7ff!important;cursor:pointer!important;box-shadow:inset 0 0 0 1px rgba(121,239,49,.05),0 10px 30px rgba(0,0,0,.2)!important;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease!important}
.mova-ai-launch-icon:hover{transform:translateY(-1px)!important;border-color:rgba(121,239,49,.65)!important;box-shadow:0 0 0 3px rgba(98,200,255,.06),0 12px 34px rgba(0,0,0,.28)!important}.mova-ai-launch-icon:active{transform:scale(.97)!important}
.mova-ai-icon-core{font-size:14px!important;font-weight:950!important;letter-spacing:-.02em!important;color:#74d8ff!important}.mova-ai-icon-spark{position:absolute!important;top:7px!important;right:8px!important;font-size:11px!important;line-height:1!important;color:#79ef31!important;text-shadow:0 0 10px rgba(121,239,49,.7)!important}
.mova-ai-modal{position:fixed!important;inset:0!important;z-index:1200!important;display:none!important;align-items:center!important;justify-content:center!important;padding:24px!important;background:rgba(1,6,10,.76)!important;backdrop-filter:blur(12px)!important}.mova-ai-modal.open{display:flex!important}
.mova-ai-dialog{width:min(94vw,920px)!important;max-height:min(88vh,860px)!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;border:1px solid rgba(98,200,255,.24)!important;border-radius:24px!important;background:linear-gradient(180deg,#0a141e,#071018)!important;box-shadow:0 34px 100px rgba(0,0,0,.58)!important}
.mova-ai-dialog-head{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:18px!important;padding:20px 22px 16px!important;border-bottom:1px solid rgba(255,255,255,.065)!important}.mova-ai-dialog-brand{display:flex!important;align-items:center!important;gap:12px!important}.mova-ai-dialog-icon{position:relative!important;display:grid!important;place-items:center!important;width:44px!important;height:44px!important;flex:0 0 44px!important;border:1px solid rgba(98,200,255,.42)!important;border-radius:14px!important;background:linear-gradient(145deg,#0c2b42,#0a1723)!important}.mova-ai-dialog-icon b{font-size:12px!important;color:#70d6ff!important}.mova-ai-dialog-icon i{position:absolute!important;right:6px!important;top:5px!important;font-style:normal!important;color:#79ef31!important;font-size:9px!important}.mova-ai-dialog-head h2{margin:0!important;font-size:22px!important}.mova-ai-dialog-head p{margin:4px 0 0!important;font-size:10px!important;color:var(--muted)!important}.mova-ai-close{width:38px!important;height:38px!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:12px!important;background:#0c1720!important;color:#a9bcc9!important;font-size:22px!important;line-height:1!important;cursor:pointer!important}.mova-ai-close:hover{color:#fff!important;border-color:rgba(98,200,255,.35)!important}
.mova-ai-suggestion-wrap{padding:16px 22px 8px!important}.mova-ai-suggestion-label{margin-bottom:8px!important;font-size:9px!important;font-weight:850!important;letter-spacing:.09em!important;color:#7890a1!important;text-transform:uppercase!important}.mova-ai-suggestions{display:flex!important;gap:7px!important;flex-wrap:wrap!important}.mova-ai-suggestions button{border:1px solid rgba(98,200,255,.15)!important;background:#091722!important;color:#bdd0dc!important;padding:8px 11px!important;border-radius:999px!important;font-size:9px!important;cursor:pointer!important}.mova-ai-suggestions button:hover{color:#fff!important;border-color:rgba(98,200,255,.48)!important;background:#0b1d2b!important}
.mova-ai-dialog .mova-ai-thread{display:grid!important;gap:10px!important;min-height:150px!important;max-height:48vh!important;overflow:auto!important;margin:0!important;padding:12px 22px 18px!important}.mova-ai-dialog .mova-ai-thread:empty{min-height:18px!important;padding-top:4px!important}.mova-ai-dialog .mova-ai-msg{padding:13px 14px!important;border-radius:14px!important;line-height:1.65!important;white-space:pre-wrap!important;font-size:12px!important}.mova-ai-dialog .mova-ai-msg.user{margin-left:12%!important;background:#0b2030!important;border:1px solid rgba(98,200,255,.18)!important}.mova-ai-dialog .mova-ai-msg.assistant{margin-right:3%!important;background:#09140e!important;border:1px solid rgba(121,239,49,.14)!important;color:#d9e6ee!important}.mova-ai-dialog .mova-ai-msg.error{background:#251017!important;border-color:rgba(255,93,103,.28)!important;color:#ffd8dc!important}.mova-ai-dialog .mova-ai-thinking{color:var(--muted)!important;font-size:10px!important;padding:8px 2px!important}.mova-ai-dialog .mova-ai-sources{display:flex!important;gap:6px!important;flex-wrap:wrap!important;margin-top:9px!important}.mova-ai-dialog .mova-ai-sources a{font-size:8px!important;color:var(--blue)!important;text-decoration:none!important;border:1px solid rgba(98,200,255,.16)!important;background:#071019!important;padding:5px 7px!important;border-radius:999px!important}
.mova-ai-composer{display:grid!important;grid-template-columns:minmax(0,1fr) 48px!important;gap:9px!important;align-items:center!important;padding:14px 22px 20px!important;border-top:1px solid rgba(255,255,255,.065)!important;background:#08121a!important}.mova-ai-composer input{width:100%!important;height:48px!important;border:1px solid rgba(255,255,255,.1)!important;border-radius:14px!important;background:#06101a!important;color:#fff!important;padding:0 14px!important;font:inherit!important;font-size:12px!important;outline:none!important}.mova-ai-composer input:focus{border-color:rgba(98,200,255,.62)!important;box-shadow:0 0 0 3px rgba(98,200,255,.05)!important}.mova-ai-send{display:grid!important;place-items:center!important;width:48px!important;height:48px!important;border:0!important;border-radius:14px!important;background:linear-gradient(135deg,var(--blue2),#2dbca4,var(--green))!important;color:#041018!important;font-size:20px!important;font-weight:900!important;cursor:pointer!important}.mova-ai-send:disabled{opacity:.45!important;cursor:wait!important}.mova-ai-footer-note{padding:0 22px 15px!important;margin-top:-7px!important;color:#708493!important;font-size:8px!important;background:#08121a!important}
body.mova-ai-modal-open{overflow:hidden!important}
@media(max-width:800px){.mova-ask-ai-tools{margin-bottom:20px!important}.mova-ask-ai-tools .mova-ask-title{font-size:23px!important;margin-bottom:9px!important}.mova-ai-launch-form{grid-template-columns:minmax(0,1fr) 50px!important;gap:8px!important}.mova-ai-launch-form input{height:50px!important;min-height:50px!important;line-height:50px!important;font-size:13px!important;padding:0 13px!important}.mova-ai-launch-icon{width:50px!important;height:50px!important;border-radius:14px!important}.mova-ai-modal{padding:10px!important;align-items:flex-end!important}.mova-ai-dialog{width:100%!important;max-height:92vh!important;border-radius:22px 22px 14px 14px!important}.mova-ai-dialog-head{padding:16px 15px 13px!important}.mova-ai-dialog-head h2{font-size:19px!important}.mova-ai-suggestion-wrap{padding:13px 15px 7px!important}.mova-ai-suggestions{flex-wrap:nowrap!important;overflow-x:auto!important;padding-bottom:4px!important}.mova-ai-suggestions button{white-space:nowrap!important}.mova-ai-dialog .mova-ai-thread{padding:10px 15px 14px!important;max-height:48vh!important}.mova-ai-dialog .mova-ai-msg{font-size:11px!important}.mova-ai-dialog .mova-ai-msg.user{margin-left:4%!important}.mova-ai-dialog .mova-ai-msg.assistant{margin-right:0!important}.mova-ai-composer{padding:12px 15px 15px!important}.mova-ai-footer-note{padding:0 15px 12px!important}}
</style>'''
          s, n = re.subn(r'<style id="mova-ask-ai-tools-css">.*?</style>', css, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace MOVA AI tools CSS')

          launcher = r'''<section class="mova-ask-ai mova-ask-ai-tools" id="movaAskAi">
  <h2 class="mova-ask-title">Ask MOVA AI</h2>
  <form class="mova-ai-launch-form" onsubmit="return movaAiLaunchFromTools(event)">
    <input id="movaAiLauncherQuestion" type="search" autocomplete="off" aria-label="Ask MOVA AI" placeholder="Ask about any stock, market or your portfolio...">
    <button class="mova-ai-launch-icon" type="button" onclick="return movaAiOpenModal()" aria-label="Open MOVA AI analysis">
      <span class="mova-ai-icon-core">AI</span><span class="mova-ai-icon-spark">&#10022;</span>
    </button>
  </form>
</section>'''
          s, n = re.subn(r'<section class="mova-ask-ai mova-ask-ai-tools" id="movaAskAi">.*?</section>', launcher, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace MOVA AI launcher')

          modal = r'''
<div class="mova-ai-modal" id="movaAiModal" aria-hidden="true" onclick="if(event.target===this)movaAiCloseModal()">
  <section class="mova-ai-dialog" role="dialog" aria-modal="true" aria-labelledby="movaAiDialogTitle">
    <div class="mova-ai-dialog-head">
      <div class="mova-ai-dialog-brand">
        <span class="mova-ai-dialog-icon"><b>AI</b><i>&#10022;</i></span>
        <div><h2 id="movaAiDialogTitle">MOVA AI</h2><p>Company research, market context and portfolio analysis</p></div>
      </div>
      <button class="mova-ai-close" type="button" onclick="return movaAiCloseModal()" aria-label="Close MOVA AI">&times;</button>
    </div>
    <div class="mova-ai-suggestion-wrap">
      <div class="mova-ai-suggestion-label">Suggested questions</div>
      <div class="mova-ai-suggestions" id="movaAiSuggestions"></div>
    </div>
    <div class="mova-ai-thread" id="movaAiThread" aria-live="polite"></div>
    <form class="mova-ai-composer" id="movaAiModalForm" onsubmit="return movaAskAiSubmit(event)">
      <input id="movaAiQuestion" type="search" autocomplete="off" aria-label="Question for MOVA AI" placeholder="Ask a follow-up or start a new analysis...">
      <button class="mova-ai-send" id="movaAiAskBtn" type="submit" aria-label="Send question">&#8593;</button>
    </form>
    <div class="mova-ai-footer-note">MOVA combines available market, company, news and portfolio data. Investment conclusions are research context, not personalised financial advice.</div>
  </section>
</div>
'''
          if 'id="movaAiModal"' not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing body close for MOVA AI modal')
              s = s.replace('</body>', modal + '\n</body>', 1)

          js = r'''<script id="mova-ask-ai-js">
const movaAiHistory=[];
function movaAiEscape(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
function movaAiPortfolioPayload(){
  const rows=(Array.isArray(holdings)?holdings:[]).map(h=>({ticker:h.ticker,qty:Number(h.qty)||0,avg:Number(h.avg)||0,current:Number(h.current)||0}));
  return {holdings:rows,cash:Number((typeof walletState!=='undefined'&&walletState)?walletState.balance:0)||0};
}
function movaAiTopHolding(){
  const rows=(Array.isArray(holdings)?holdings:[]).map(h=>({ticker:String(h.ticker||'').toUpperCase(),value:(Number(h.qty)||0)*(Number(h.current)||Number(h.avg)||0)})).filter(x=>x.ticker).sort((a,b)=>b.value-a.value);
  return rows[0]?.ticker||'NVDA';
}
function movaAiRenderSuggestions(){
  const host=document.getElementById('movaAiSuggestions');if(!host)return;
  const top=movaAiTopHolding();
  const qs=[`Why is ${top} moving and what matters next?`,`Give me the bull and bear case for ${top}.`,'What current news could affect my portfolio?','Which of my holdings has the highest concentration risk?','Which market sectors are strongest right now?','Explain a stock\'s investment history and key turning points.'];
  host.innerHTML=qs.map(q=>`<button type="button" onclick="return movaAiRunPrompt(decodeURIComponent('${encodeURIComponent(q)}'))">${movaAiEscape(q)}</button>`).join('');
}
function movaAiOpenModal(prefill=''){
  const modal=document.getElementById('movaAiModal'),input=document.getElementById('movaAiQuestion');if(!modal)return false;
  movaAiRenderSuggestions();modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('mova-ai-modal-open');
  if(input&&prefill)input.value=prefill;setTimeout(()=>input?.focus(),40);return false;
}
function movaAiCloseModal(){const modal=document.getElementById('movaAiModal');if(modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}document.body.classList.remove('mova-ai-modal-open');return false;}
function movaAiLaunchFromTools(ev){
  if(ev)ev.preventDefault();const launcher=document.getElementById('movaAiLauncherQuestion');const q=String(launcher?.value||'').trim();movaAiOpenModal(q);
  if(q){if(launcher)launcher.value='';setTimeout(()=>document.getElementById('movaAiModalForm')?.requestSubmit(),50)}return false;
}
function movaAiUsePrompt(q){movaAiOpenModal(q);}
function movaAiRunPrompt(q){movaAiOpenModal(q);setTimeout(()=>document.getElementById('movaAiModalForm')?.requestSubmit(),50);return false;}
function movaAiScroll(){const host=document.getElementById('movaAiThread');if(host)host.scrollTop=host.scrollHeight;}
function movaAiAdd(role,text,sources=[]){
  const host=document.getElementById('movaAiThread');if(!host)return;
  const box=document.createElement('div');box.className='mova-ai-msg '+role;box.textContent=String(text??'');
  if(Array.isArray(sources)&&sources.length){const src=document.createElement('div');src.className='mova-ai-sources';sources.slice(0,8).forEach((s,i)=>{if(!s||!s.url)return;const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener';a.textContent=String(s.title||('Source '+(i+1))).slice(0,70);src.appendChild(a)});box.appendChild(src)}
  host.appendChild(box);movaAiScroll();
}
function movaAiClear(){movaAiHistory.length=0;const host=document.getElementById('movaAiThread');if(host)host.innerHTML='';}
async function movaAskAiSubmit(ev){
  if(ev)ev.preventDefault();movaAiOpenModal();
  const input=document.getElementById('movaAiQuestion'),btn=document.getElementById('movaAiAskBtn'),host=document.getElementById('movaAiThread');
  const q=String(input&&input.value||'').trim();if(!q)return false;
  movaAiAdd('user',q);movaAiHistory.push({role:'user',content:q});if(input)input.value='';
  if(btn){btn.disabled=true;btn.textContent='...'}
  const thinking=document.createElement('div');thinking.className='mova-ai-thinking';thinking.textContent='MOVA is researching the company, market data, price history and relevant news...';if(host)host.appendChild(thinking);movaAiScroll();
  try{
    const r=await fetch('/api/ask-ai',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({question:q,portfolio:movaAiPortfolioPayload(),history:movaAiHistory.slice(-8)})});
    const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||('Ask AI '+r.status));
    thinking.remove();movaAiAdd('assistant',d.answer||'No answer returned.',d.sources||[]);movaAiHistory.push({role:'assistant',content:d.answer||''});
  }catch(e){thinking.remove();movaAiAdd('error','MOVA AI could not complete this request: '+e.message)}finally{if(btn){btn.disabled=false;btn.textContent='\u2191'}}
  return false;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('movaAiModal')?.classList.contains('open'))movaAiCloseModal();});
</script>'''
          s, n = re.subn(r'<script id="mova-ask-ai-js">.*?</script>', js, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace MOVA AI JS')

          s = s.replace('<!-- MOVA BUILD v173 ASK MOVA AI TOOLS -->','<!-- MOVA BUILD v174 MOVA AI POPUP -->',1)
          s = s.replace('data-mova-build="v173-ask-mova-ai-tools"','data-mova-build="v174-mova-ai-popup"',1)

          for check in ['id="movaAiLauncherQuestion"','id="movaAiModal"','id="movaAiSuggestions"','function movaAiLaunchFromTools','MOVA BUILD v174 MOVA AI POPUP']:
              if check not in s: raise SystemExit('Missing index update: '+check)
          p.write_text(s,encoding='utf-8')

          # ---------------- api/ask-ai.js ----------------
          p = Path('api/ask-ai.js')
          s = p.read_text(encoding='utf-8')

          helper = r'''
const MOVA_COMPANY_NAMES={NVDA:'NVIDIA',MSFT:'Microsoft',AAPL:'Apple',AMZN:'Amazon',META:'Meta Platforms',GOOGL:'Alphabet',GOOG:'Alphabet',TSLA:'Tesla',AVGO:'Broadcom',AMD:'Advanced Micro Devices',ASML:'ASML Holding',PLTR:'Palantir Technologies',NFLX:'Netflix',INTC:'Intel',MU:'Micron Technology',ARM:'Arm Holdings',QCOM:'Qualcomm',ORCL:'Oracle',CRM:'Salesforce',ADBE:'Adobe'};
const MOVA_TICKER_STOP=new Set(['MOVA','AI','ETF','ETFS','USD','US','UK','CEO','CFO','EPS','PE','P','L','IPO','ADR','THE','AND','WHAT','WHO','WHY','HOW','IS','ARE','MY']);
function inferTicker(q){
  const raw=String(q||'');
  for(const [name,ticker] of Object.entries(MOVA_COMPANY_NAMES)){if(new RegExp('\\b'+name.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\b','i').test(raw))return ticker;}
  const tokens=raw.match(/\b[A-Z][A-Z0-9.\-]{1,7}\b/g)||[];
  return tokens.find(x=>!MOVA_TICKER_STOP.has(x))||'';
}
function isPortfolioIntent(q){
  const s=String(q||'').toLowerCase();
  return /\bportfolio\b|\bholdings?\b|\bpositions?\b|\ballocation\b|\bconcentration\b|\bdiversif|\bunrealised\b|\bp\/?l\b/.test(s) || /\b(my|our)\s+(investments?|stocks?|shares?)\b/.test(s);
}
function pct(v){return Number.isFinite(v)?`${v>=0?'+':''}${v.toFixed(1)}%`:'n/a';}
function histStats(values){
  const rows=(Array.isArray(values)?values:[]).map(v=>({date:v.datetime,close:Number(v.close),high:Number(v.high),low:Number(v.low)})).filter(v=>Number.isFinite(v.close));
  if(!rows.length)return null;const latest=rows[0].close;const ret=i=>rows[i]&&rows[i].close?((latest/rows[i].close)-1)*100:null;const yr=rows.slice(0,253);const highs=yr.map(x=>x.high).filter(Number.isFinite),lows=yr.map(x=>x.low).filter(Number.isFinite);
  return {latest,date:rows[0].date,oneMonth:ret(21),threeMonth:ret(63),sixMonth:ret(126),oneYear:ret(252),high52:highs.length?Math.max(...highs):null,low52:lows.length?Math.min(...lows):null};
}
async function jsonOrNull(url){try{const r=await fetch(url,{headers:{Accept:'application/json'}});const d=await r.json().catch(()=>null);return r.ok&&d&&!d.error?d:null;}catch{return null;}}
async function fallbackCompanyAnswer(request,question){
  const ticker=inferTicker(question);if(!ticker)return null;const name=MOVA_COMPANY_NAMES[ticker]||ticker;const origin=new URL(request.url).origin;
  const [profile,market,history,news]=await Promise.all([
    jsonOrNull(`${origin}/api/company-history?ticker=${encodeURIComponent(ticker)}&name=${encodeURIComponent(name)}`),
    jsonOrNull(`${origin}/api/market?symbols=${encodeURIComponent(ticker)}`),
    jsonOrNull(`${origin}/api/history?symbol=${encodeURIComponent(ticker)}&interval=1day&outputsize=260`),
    jsonOrNull(`${origin}/api/news?symbols=${encodeURIComponent(ticker)}`)
  ]);
  if(!profile&&!market&&!history&&!news)return null;
  const a=market?.assets?.[0]||null,h=histStats(history?.values),heads=(news?.items||[]).slice(0,4),timeline=(profile?.timeline||[]).slice(0,5),sources=[];
  if(profile?.website)sources.push({title:`${name} official website`,url:profile.website});for(const x of heads){if(x?.url&&!sources.some(y=>y.url===x.url))sources.push({title:x.title||x.headline||`${ticker} news`,url:x.url});}
  const parts=[];
  parts.push(`${name} (${ticker}) - MOVA research snapshot`);
  if(profile?.summary)parts.push(`\nWho they are\n${safeText(profile.summary,1800)}`);
  if(profile?.sections?.business)parts.push(`\nHow the business works\n${safeText(profile.sections.business,1300)}`);
  const facts=[];if(profile?.foundedDisplay)facts.push(`Founded: ${profile.foundedDisplay}`);if(profile?.headquarters)facts.push(`Headquarters: ${profile.headquarters}`);if(facts.length)parts.push(`\nCompany background\n${facts.join('\n')}`);
  if(h){let line=`Latest historical close returned: ${money(h.latest)}${h.date?` (${h.date})`:''}.`;const moves=[];if(Number.isFinite(h.oneMonth))moves.push(`1 month ${pct(h.oneMonth)}`);if(Number.isFinite(h.threeMonth))moves.push(`3 months ${pct(h.threeMonth)}`);if(Number.isFinite(h.sixMonth))moves.push(`6 months ${pct(h.sixMonth)}`);if(Number.isFinite(h.oneYear))moves.push(`1 year ${pct(h.oneYear)}`);if(moves.length)line+=` Approximate price performance: ${moves.join(', ')}.`;if(Number.isFinite(h.low52)&&Number.isFinite(h.high52))line+=` 52-week range in the returned series: ${money(h.low52)} to ${money(h.high52)}.`;parts.push(`\nInvestment / share-price history\n${line}`);}
  if(a)parts.push(`\nCurrent market read\n${ticker} is currently ${pct(Number(a.changePct)||0)} on the day at about ${money(Number(a.priceNative??a.priceUSD??a.price))}. MOVA classifies the current daily direction as ${a.analysis?.direction||'mixed'} with ${a.analysis?.momentum||'normal'} momentum. Market data source: ${a.provider||market?.source||'MOVA market feed'}.`);
