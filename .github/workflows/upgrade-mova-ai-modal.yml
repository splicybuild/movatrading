name: Upgrade MOVA AI popup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upgrade-mova-ai-modal.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply MOVA AI upgrade
        run: python3 .github/scripts/upgrade_mova_ai.py
      - name: Commit production update
        run: |
          rm .github/scripts/upgrade_mova_ai.py
          rm .github/workflows/upgrade-mova-ai-modal.yml
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade MOVA AI popup and company research"
          git push origin main
