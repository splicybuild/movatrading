name: Inspect MOVA ticker/company markup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-mova-branding.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and inspect ticker/company markup
        run: |
          npm run build
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('dist/index.html').read_text(encoding='utf-8')
          for title,pat in [
            ('TICKER FUNCTIONS',r'function\s+[^\s(]*(?:ticker|Ticker)[^\s(]*\([^)]*\)\{.{0,5000}'),
            ('OPEN COMPANY',r'function\s+openCompanyResearch\([^)]*\)\{.{0,7000}'),
            ('TICKER MARKUP',r'.{0,1200}(?:ticker-track|ticker-row|ticker-card|ticker-strip|stock-ticker).{0,5000}'),
            ('COMPANY VIEW',r'.{0,1500}id="companyResearchView".{0,10000}'),
            ('COMPANY IMAGES',r'.{0,600}(?:crLogo|crHero|company-logo|company-image|logoUrl|profile\.logo).{0,1600}'),
            ('MODAL TICKER CLICK',r'.{0,1200}(?:Open in Pulse|open in Pulse|OPEN IN PULSE).{0,2500}')
          ]:
            print('\n===',title,'===')
            found=False
            for m in re.finditer(pat,s,re.I|re.S):
              print(m.group(0)[:12000]); found=True
              if title not in ('COMPANY IMAGES',): break
            if not found: print('NONE')
          PY
