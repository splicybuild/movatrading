name: Install MOVA Ask AI home panel

on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-home-ask-ai.yml']

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Ask MOVA AI to home page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          if 'id="movaAskAi"' in s:
              raise SystemExit('Ask AI panel already installed')

          css='''\n<style id="mova-ask-ai-css">\n.mova-ask-ai{margin:26px 0 12px;padding:20px;border:1px solid rgba(98,200,255,.18);background:linear-gradient(145deg,rgba(8,20,31,.98),rgba(7,13,21,.98));border-radius:20px;box-shadow:0 20px 55px rgba(0,0,0,.22)}\n.mova-ask-ai-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.mova-ask-ai-head h2{margin:4px 0 6px;font-size:24px}.mova-ask-ai-badge{font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--green);border:1px solid rgba(121,239,49,.25);background:rgba(121,239,49,.06);padding:7px 9px;border-radius:999px;white-space:nowrap}\n.mova-ai-prompts{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.mova-ai-prompts button{border:1px solid rgba(98,200,255,.15);background:#09151f;color:#bcd0dd;padding:7px 10px;border-radius:999px;font-size:9px;cursor:pointer}.mova-ai-prompts button:hover{color:#fff;border-color:var(--blue)}\n.mova-ai-form{display:grid;grid-template-columns:1fr auto;gap:9px}.mova-ai-form textarea{width:100%;min-height:82px;resize:vertical;background:#071019;color:#fff;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:13px 14px;line-height:1.5}.mova-ai-form textarea:focus{outline:none;border-color:rgba(98,200,255,.65);box-shadow:0 0 0 3px rgba(98,200,255,.06)}.mova-ai-form button{align-self:stretch;min-width:118px}.mova-ai-meta{margin-top:8px;font-size:9px;color:var(--muted)}\n.mova-ai-thread{display:grid;gap:10px;margin-top:15px}.mova-ai-msg{padding:13px 14px;border-radius:14px;line-height:1.58;white-space:pre-wrap;font-size:11px}.mova-ai-msg.user{margin-left:12%;background:#0b2030;border:1px solid rgba(98,200,255,.18)}.mova-ai-msg.assistant{margin-right:4%;background:#09140e;border:1px solid rgba(121,239,49,.14);color:#d9e6ee}.mova-ai-msg.error{background:#251017;border-color:rgba(255,93,103,.28);color:#ffd8dc}.mova-ai-thinking{color:var(--muted);font-size:10px;padding:8px 2px}.mova-ai-sources{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mova-ai-sources a{font-size:8px;color:var(--blue);text-decoration:none;border:1px solid rgba(98,200,255,.16);background:#071019;padding:5px 7px;border-radius:999px}.mova-ai-tools{display:flex;justify-content:flex-end;margin-top:8px}.mova-ai-tools button{border:0;background:none;color:var(--muted);font-size:9px;cursor:pointer}\n@media(max-width:800px){.mova-ask-ai{padding:15px;margin-top:20px}.mova-ask-ai-head{display:block}.mova-ask-ai-badge{display:inline-block;margin-top:7px}.mova-ai-form{grid-template-columns:1fr}.mova-ai-form button{min-height:46px}.mova-ai-msg.user{margin-left:4%}.mova-ai-msg.assistant{margin-right:0}.mova-ai-prompts{overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.mova-ai-prompts button{white-space:nowrap}}\n</style>\n'''
          if '</head>' not in s: raise SystemExit('head close missing')
          s=s.replace('</head>',css+'</head>',1)

          panel='''\n  <section class="mova-ask-ai" id="movaAskAi">\n    <div class="mova-ask-ai-head">\n      <div><div class="label">ASK MOVA AI</div><h2>Ask anything about a stock — or your portfolio</h2><p class="muted">Research shares, explain today's move, connect relevant news and market drivers, or analyse your own holdings and growth scenarios.</p></div>\n      <span class="mova-ask-ai-badge">LIVE RESEARCH + PORTFOLIO CONTEXT</span>\n    </div>\n    <div class="mova-ai-prompts">\n      <button type="button" onclick="movaAiUsePrompt('What is affecting NVIDIA today and what should I watch next?')">Why is NVDA moving?</button>\n      <button type="button" onclick="movaAiUsePrompt('Analyse my portfolio. Where are my biggest concentration risks and opportunities?')">Analyse my portfolio</button>\n      <button type="button" onclick="movaAiUsePrompt('Project my portfolio growth over 1, 3 and 5 years using sensible bear, base and bull scenarios and explain the assumptions.')">Project portfolio growth</button>\n      <button type="button" onclick="movaAiUsePrompt('What current news could materially affect my portfolio holdings?')">News affecting my holdings</button>\n    </div>\n    <form class="mova-ai-form" onsubmit="return movaAskAiSubmit(event)">\n      <textarea id="movaAiQuestion" placeholder="e.g. Is AMD attractive at its current level? What risks are affecting my portfolio? How might my holdings perform over five years?"></textarea>\n      <button class="btn btn-primary" id="movaAiAskBtn" type="submit">Ask MOVA AI →</button>\n    </form>\n    <div class="mova-ai-meta">Uses MOVA portfolio data plus current web/news research when available. Projections are scenarios, not guarantees.</div>\n    <div class="mova-ai-thread" id="movaAiThread" aria-live="polite"></div>\n    <div class="mova-ai-tools"><button type="button" onclick="movaAiClear()">Clear conversation</button></div>\n  </section>\n'''
          marker='  <p class="notice m127-disclaimer">'
          if marker not in s: raise SystemExit('home disclaimer marker missing')
          s=s.replace(marker,panel+'\n'+marker,1)

          js='''\n<script id="mova-ask-ai-js">\nconst movaAiHistory=[];\nfunction movaAiEscape(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}\nfunction movaAiPortfolioPayload(){\n  const rows=(Array.isArray(holdings)?holdings:[]).map(h=>({ticker:h.ticker,qty:Number(h.qty)||0,avg:Number(h.avg)||0,current:Number(h.current)||0}));\n  return {holdings:rows,cash:Number((typeof walletState!=='undefined'&&walletState)?walletState.balance:0)||0};\n}\nfunction movaAiUsePrompt(q){const el=document.getElementById('movaAiQuestion');if(!el)return;el.value=q;el.focus();}\nfunction movaAiAdd(role,text,sources=[]){\n  const host=document.getElementById('movaAiThread');if(!host)return;\n  const box=document.createElement('div');box.className='mova-ai-msg '+role;box.innerHTML=movaAiEscape(text);\n  if(Array.isArray(sources)&&sources.length){const src=document.createElement('div');src.className='mova-ai-sources';sources.slice(0,8).forEach((s,i)=>{if(!s||!s.url)return;const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener';a.textContent=String(s.title||('Source '+(i+1))).slice(0,55);src.appendChild(a)});box.appendChild(src)}\n  host.appendChild(box);\n}\nfunction movaAiClear(){movaAiHistory.length=0;const host=document.getElementById('movaAiThread');if(host)host.innerHTML='';}\nasync function movaAskAiSubmit(ev){\n  if(ev)ev.preventDefault();\n  const input=document.getElementById('movaAiQuestion'),btn=document.getElementById('movaAiAskBtn'),host=document.getElementById('movaAiThread');\n  const q=String(input&&input.value||'').trim();if(!q)return false;\n  movaAiAdd('user',q);movaAiHistory.push({role:'user',content:q});if(input)input.value='';\n  if(btn){btn.disabled=true;btn.textContent='Researching…'}\n  const thinking=document.createElement('div');thinking.className='mova-ai-thinking';thinking.textContent='MOVA AI is checking your portfolio, market context and relevant news…';if(host)host.appendChild(thinking);\n  try{\n    const r=await fetch('/api/ask-ai',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({question:q,portfolio:movaAiPortfolioPayload(),history:movaAiHistory.slice(-8)})});\n    const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||('Ask AI '+r.status));\n    thinking.remove();movaAiAdd('assistant',d.answer||'No answer returned.',d.sources||[]);movaAiHistory.push({role:'assistant',content:d.answer||''});\n  }catch(e){thinking.remove();movaAiAdd('error','MOVA AI could not complete this request: '+e.message)}finally{if(btn){btn.disabled=false;btn.textContent='Ask MOVA AI →'}}\n  return false;\n}\n</script>\n'''
          s += js
          s=s.replace('<!-- MOVA BUILD v171 ORGANIZED BRAND ASSETS -->','<!-- MOVA BUILD v172 ASK MOVA AI -->')
          s=s.replace('data-mova-build="v171-organized-brand-assets"','data-mova-build="v172-ask-mova-ai"')
          for needle in ['id="movaAskAi"','/api/ask-ai','movaAiPortfolioPayload','v172-ask-mova-ai']:
            if needle not in s: raise SystemExit('missing '+needle)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/install-home-ask-ai.yml
      - name: Commit
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Ask MOVA AI to home page"
          git push origin main
