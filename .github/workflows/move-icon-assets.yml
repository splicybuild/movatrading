name: Move MOVA icon assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/move-icon-assets.yml'

permissions:
  contents: write

jobs:
  tidy-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move icon assets into assets/icons
        run: |
          mkdir -p assets/icons
          for f in favicon.ico mova-favicon-16.png mova-favicon-32.png mova-favicon-180.png mova-favicon-512.png; do
            test -f "$f"
            git mv "$f" "assets/icons/$f"
          done

          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps={
            '/favicon.ico?v=169':'/assets/icons/favicon.ico?v=170',
            '/mova-favicon-32.png?v=169':'/assets/icons/mova-favicon-32.png?v=170',
            '/mova-favicon-16.png?v=169':'/assets/icons/mova-favicon-16.png?v=170',
            '/mova-favicon-180.png?v=169':'/assets/icons/mova-favicon-180.png?v=170',
          }
          for old,new in reps.items():
            s=s.replace(old,new)
          s=s.replace('<!-- MOVA BUILD v169 SINGLE FAVICON SOURCE -->','<!-- MOVA BUILD v170 ICON ASSETS FOLDER -->')
          s=s.replace('data-mova-build="v169-single-favicon-source"','data-mova-build="v170-icon-assets-folder"')
          checks=[
            '/assets/icons/favicon.ico?v=170',
            '/assets/icons/mova-favicon-32.png?v=170',
            '/assets/icons/mova-favicon-16.png?v=170',
            '/assets/icons/mova-favicon-180.png?v=170',
            'MOVA-wordmarklogo-display.png?v=162'
          ]
          for c in checks:
            if c not in s:
              raise SystemExit(f'Missing expected reference: {c}')
          p.write_text(s,encoding='utf-8')
          PY

          rm .github/workflows/move-icon-assets.yml

      - name: Commit tidy icon structure
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Move MOVA icon assets into dedicated folder"
          git push origin main
