name: Install approved MOVA branding

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-approved-mova-branding.yml'

permissions:
  contents: write

jobs:
  install-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install approved MOVA assets and patch index
        run: |
          cp mova-recovered-app-icon.png mova-approved-icon.png
          cp mova-recovered-wordmark.png mova-approved-wordmark.png

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Replace active favicon / touch-icon references to the rejected bull asset.
          text = re.sub(r'mova-icon-black-blue\.png(?:\?v=\d+)?', 'mova-approved-icon.png?v=156', text)

          # Replace the header contents with the exact recovered approved icon + wordmark files.
          brand_open = re.search(r'(<div\s+aria-label="Go to Home"\s+class="brand"\s+id="brandHome"[^>]*>)', text, re.I)
          if not brand_open:
              raise SystemExit('Could not locate brandHome header container.')
          start = brand_open.end()
          end = text.find('</div>', start)
          if end < 0:
              raise SystemExit('Could not locate brandHome closing div.')
          header_assets = ('\n<img alt="MOVA icon" class="brand-app-icon" src="mova-approved-icon.png?v=156">'
                           '\n<img alt="MOVA TRADING" class="brand-wordmark" src="mova-approved-wordmark.png?v=156">\n')
          text = text[:start] + header_assets + text[end:]

          # Mobile welcome/app screen must use the approved icon only.
          text = text.replace('const source=document.querySelector(".brand-wordmark");',
                              'const source=document.querySelector(".brand-app-icon");')

          # Remove the previous single-wordmark canonical branding block.
          text = re.sub(
              r'\n\s*/\* v153 CANONICAL MOVA BRANDING — one wordmark, desktop \+ mobile \*/.*?(?=\n\s*</style>)',
              '', text, count=1, flags=re.S
          )

          css = r'''
/* v156 APPROVED MOVA BRANDING — exact recovered v126 icon + original wordmark */
header .brand{
  display:flex!important;
  align-items:center!important;
  justify-content:flex-start!important;
  width:auto!important;
  gap:10px!important;
  flex:0 0 auto!important;
}
header .brand-app-icon{
  display:block!important;
  width:58px!important;
  height:58px!important;
  flex:0 0 58px!important;
  object-fit:contain!important;
  border-radius:0!important;
  margin:0!important;
  box-shadow:none!important;
}
header .brand-wordmark{
  display:block!important;
  height:52px!important;
  width:auto!important;
  max-width:min(40vw,520px)!important;
  object-fit:contain!important;
  object-position:left center!important;
  margin:0!important;
}
header .mova-brand-copy{display:none!important}

@media(max-width:800px){
  header .brand{
    justify-content:center!important;
    width:auto!important;
    gap:0!important;
  }
  header .brand-app-icon{
    display:block!important;
    width:54px!important;
    height:54px!important;
    flex:0 0 54px!important;
    object-fit:contain!important;
    margin:0!important;
  }
  header .brand-wordmark{display:none!important}
  body.mova-mobile-welcome .mobile-auth-brand{
    display:flex!important;
    flex-direction:column!important;
    align-items:center!important;
  }
  body.mova-mobile-welcome .mobile-auth-brand>.label{
    order:1!important;
    margin:0 0 10px!important;
  }
  body.mova-mobile-welcome .mobile-auth-logo{
    order:2!important;
    display:block!important;
    width:min(34vw,128px)!important;
    max-width:128px!important;
    height:auto!important;
    object-fit:contain!important;
    border-radius:0!important;
    margin:0 auto 10px!important;
    box-shadow:none!important;
  }
  body.mova-mobile-welcome .mobile-auth-full-brand{display:none!important}
  body.mova-mobile-welcome .mobile-auth-tagline{order:3!important}
}
'''

          pos = text.rfind('</style>')
          if pos < 0:
              raise SystemExit('No closing style tag found for final branding CSS.')
          text = text[:pos] + '\n' + css + '\n' + text[pos:]

          text = re.sub(r'<!-- MOVA BUILD v\d+[^>]*-->',
                        '<!-- MOVA BUILD v156 APPROVED BRAND ASSETS -->', text, count=1)
          text = re.sub(r'data-mova-build="[^"]+"',
                        'data-mova-build="v156-approved-brand-assets"', text, count=1)

          # Safety checks: the rejected bull file must no longer be referenced by the app.
          if 'mova-icon-black-blue.png' in text:
              raise SystemExit('Rejected bull-logo file is still referenced in index.html.')
          for required in ('mova-approved-icon.png?v=156', 'mova-approved-wordmark.png?v=156',
                           'class="brand-app-icon"', 'class="brand-wordmark"',
                           'const source=document.querySelector(".brand-app-icon");'):
              if required not in text:
                  raise SystemExit(f'Missing required approved-branding marker: {required}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit approved branding
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html mova-approved-icon.png mova-approved-wordmark.png
          git commit -m "Install approved MOVA branding assets"
          git push origin main
