name: Install corrected desktop MOVA favicon

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-mova-header-composition.yml'

permissions:
  contents: write

jobs:
  desktop-favicon-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire corrected desktop favicon only
        run: |
          test -f mova-desktop-favicon-32.png
          test -f mova-desktop-favicon-16.png
          test -f apple-touch-icon.png
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove only desktop/browser favicon declarations.
          s = re.sub(r'\s*<link[^>]+rel=["\'](?:icon|shortcut icon)["\'][^>]*>\s*', '\n', s, flags=re.I)

          desktop_links = '''\n<link rel="icon" type="image/png" sizes="32x32" href="mova-desktop-favicon-32.png?v=164">\n<link rel="icon" type="image/png" sizes="16x16" href="mova-desktop-favicon-16.png?v=164">\n<link rel="shortcut icon" type="image/png" href="mova-desktop-favicon-32.png?v=164">\n'''
          s = s.replace('</head>', desktop_links + '\n</head>', 1)

          # IMPORTANT: leave the mobile/Apple touch icon exactly as it was.
          if 'apple-touch-icon.png?v=163' not in s:
              raise SystemExit('Existing Apple touch icon reference changed or missing')

          s = re.sub(r'<!-- MOVA BUILD v\d+[^>]*-->', '<!-- MOVA BUILD v164 DESKTOP FAVICON FIX -->', s, count=1)
          s = re.sub(r'data-mova-build="[^"]+"', 'data-mova-build="v164-desktop-favicon-fix"', s, count=1)

          if 'mova-desktop-favicon-32.png?v=164' not in s:
              raise SystemExit('Corrected desktop favicon link missing')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit desktop favicon fix
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix desktop MOVA favicon only"
          git push origin main
