name: Install exact MOVA uploaded logo

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-mova-header-composition.yml'

permissions:
  contents: write

jobs:
  update-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point all active branding to exact uploaded PNG
        run: |
          test -f MOVA-wordmarklogo.png
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          logo='MOVA-wordmarklogo.png?v=159'
          s=re.sub(r'mova-approved-wordmark\.png(?:\?v=\d+)?',logo,s)
          s=re.sub(r'mova-approved-mt\.svg(?:\?v=\d+)?',logo,s)
          s=re.sub(r'mova-approved-icon\.png(?:\?v=\d+)?',logo,s)
          s=re.sub(r'mova-icon-black-blue\.png(?:\?v=\d+)?',logo,s)
          s=re.sub(r'\s*<img[^>]*class="brand-app-icon"[^>]*>\s*','\n',s,flags=re.I)
          s=s.replace('const source=document.querySelector(".brand-app-icon");','const source=document.querySelector(".brand-wordmark");')
          s=re.sub(r'(<img[^>]*class="brand-wordmark"[^>]*src=")[^"]+("[^>]*>)',lambda m:m.group(1)+logo+m.group(2),s,count=1,flags=re.I)
          s=s.replace('mova-approved-wordmark.png?v=158',logo)
          s=re.sub(r'<!-- MOVA BUILD v\d+[^>]*-->','<!-- MOVA BUILD v159 EXACT UPLOADED LOGO -->',s,count=1)
          s=re.sub(r'data-mova-build="[^"]+"','data-mova-build="v159-exact-uploaded-logo"',s,count=1)
          if 'MOVA-wordmarklogo.png?v=159' not in s:
              raise SystemExit('exact logo reference missing')
          if 'mova-approved-mt.svg' in s or 'mova-icon-black-blue.png' in s:
              raise SystemExit('incorrect logo reference remains')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Use exact uploaded MOVA wordmark logo everywhere"
          git push origin main
