name: Correct MOVA branding source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mova-header-composition.yml'

permissions:
  contents: write

jobs:
  correct-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove invented icon and use one shared logo source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the assistant-created MT icon from all active browser/app references.
          s = s.replace('mova-approved-mt.svg?v=157', 'mova-approved-wordmark.png?v=158')
          s = s.replace('mova-approved-mt.svg', 'mova-approved-wordmark.png?v=158')

          # Remove the separate header icon element completely.
          s = re.sub(r'\s*<img[^>]*class="brand-app-icon"[^>]*>\s*', '\n', s, count=1, flags=re.I)

          # Mobile welcome/login must use the same image as desktop.
          s = s.replace('const source=document.querySelector(".brand-app-icon");',
                        'const source=document.querySelector(".brand-wordmark");')

          # Remove the previous split desktop/mobile branding CSS.
          s = re.sub(r'<style id="v156-approved-branding">.*?</style>\s*', '', s, count=1, flags=re.S)
          s = re.sub(r'<style id="v158-single-logo-source">.*?</style>\s*', '', s, count=1, flags=re.S)

          css = '''<style id="v158-single-logo-source">
          header .brand{display:flex!important;align-items:center!important;justify-content:flex-start!important;width:auto!important;gap:0!important;flex:0 0 auto!important}
          header .brand-app-icon,header .mova-brand-copy{display:none!important}
          header .brand-wordmark{display:block!important;height:58px!important;width:auto!important;max-width:min(46vw,540px)!important;object-fit:contain!important;object-position:left center!important;margin:0!important}
          @media(max-width:800px){
            header .brand{justify-content:center!important;width:100%!important;gap:0!important}
            header .brand-wordmark{display:block!important;height:auto!important;width:min(72vw,330px)!important;max-width:330px!important;object-fit:contain!important;margin:0 auto!important}
            body.mova-mobile-welcome .mobile-auth-brand{display:flex!important;flex-direction:column!important;align-items:center!important}
            body.mova-mobile-welcome .mobile-auth-brand>.label{order:1!important;margin:0 0 10px!important}
            body.mova-mobile-welcome .mobile-auth-logo{order:2!important;display:block!important;width:min(72vw,330px)!important;max-width:330px!important;height:auto!important;object-fit:contain!important;border-radius:0!important;margin:0 auto 10px!important;box-shadow:none!important}
            body.mova-mobile-welcome .mobile-auth-full-brand{display:none!important}
            body.mova-mobile-welcome .mobile-auth-tagline{order:3!important}
          }
          </style>'''
          s = s.replace('</head>', css + '\n</head>', 1)
          s = re.sub(r'<!-- MOVA BUILD v\d+[^>]*-->', '<!-- MOVA BUILD v158 SINGLE LOGO SOURCE -->', s, count=1)
          s = re.sub(r'data-mova-build="[^"]+"', 'data-mova-build="v158-single-logo-source"', s, count=1)

          if 'mova-approved-mt.svg' in s:
              raise SystemExit('invented MT SVG is still referenced')
          if re.search(r'<img[^>]*class="brand-app-icon"', s, re.I):
              raise SystemExit('separate header icon still present')
          if 'const source=document.querySelector(".brand-wordmark");' not in s:
              raise SystemExit('mobile logo is not synced to desktop logo')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Remove invented MOVA icon and unify desktop mobile branding"
          git push origin main
