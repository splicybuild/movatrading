name: Restore clean desktop MOVA favicon

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-mova-header-composition.yml'

permissions:
  contents: write

jobs:
  desktop-favicon-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore clean standalone desktop favicon
        run: |
          test -f mova-desktop-favicon-32.png
          test -f mova-desktop-favicon-16.png
          test -f apple-touch-icon.png
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove desktop/browser favicon declarations only.
          s=re.sub(r'\s*<link[^>]+rel=["\'](?:icon|shortcut icon)["\'][^>]*>\s*','\n',s,flags=re.I)

          links='''\n<link rel="icon" type="image/png" sizes="32x32" href="mova-desktop-favicon-32.png?v=167">\n<link rel="icon" type="image/png" sizes="16x16" href="mova-desktop-favicon-16.png?v=167">\n<link rel="shortcut icon" type="image/png" href="mova-desktop-favicon-32.png?v=167">\n'''
          s=s.replace('</head>',links+'\n</head>',1)

          # Mobile/Apple icon must remain untouched until desktop is approved.
          if 'apple-touch-icon.png?v=163' not in s:
              raise SystemExit('Apple/mobile icon changed; aborting')

          # Do not use any of the bad wordmark-crop favicon assets.
          if 'mova-desktop-favicon-exact2' in s or 'mova-desktop-favicon-exact-' in s:
              raise SystemExit('Bad cropped favicon reference still present')

          s=re.sub(r'<!-- MOVA BUILD v\d+[^>]*-->','<!-- MOVA BUILD v167 CLEAN DESKTOP FAVICON RESTORE -->',s,count=1)
          s=re.sub(r'data-mova-build="[^"]+"','data-mova-build="v167-clean-desktop-favicon-restore"',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit desktop favicon restore
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Restore clean standalone desktop favicon"
          git push origin main
