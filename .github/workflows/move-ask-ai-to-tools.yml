name: Apply Ask MOVA AI Tools update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/move-ask-ai-to-tools.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved app changes
        run: |
          echo '' | base64 --decode > /tmp/apply_mova.py
          python /tmp/apply_mova.py
      - name: Commit final files
        run: |
          rm .github/workflows/move-ask-ai-to-tools.yml
          git config user.name mova-build-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Move Ask MOVA AI to Tools and deepen research"
          git push origin main
