name: Apply MOVA v180 branding

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-mova-favicon-v178.yml'

permissions:
  contents: write

jobs:
  apply-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build browser and installed-app icons from new MOVA mark
        run: |
          python -m pip install --quiet pillow cairosvg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import cairosvg

          src = Path('assets/MOVA-QIcon-logo.svg')
          if not src.exists():
              raise SystemExit(f'Missing source icon: {src}')

          tmp = Path('/tmp/mova-qicon.png')
          cairosvg.svg2png(url=str(src), write_to=str(tmp), output_width=1024, output_height=1024)
          image = Image.open(tmp).convert('RGBA')
          alpha = image.getchannel('A')
          bbox = alpha.getbbox()
          if bbox:
              image = image.crop(bbox)

          def render(size: int) -> Image.Image:
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 255))
              max_side = max(1, int(size * 0.84))
              mark = ImageOps.contain(image, (max_side, max_side), Image.Resampling.LANCZOS)
              x = (size - mark.width) // 2
              y = (size - mark.height) // 2
              canvas.alpha_composite(mark, (x, y))
              return canvas.convert('RGB')

          outputs = {
              Path('assets/favicon-16x16.png'): 16,
              Path('assets/favicon-32x32.png'): 32,
              Path('assets/favicon-64x64.png'): 64,
              Path('assets/apple-touch-icon.png'): 180,
              Path('assets/mova-app-icon-192.png'): 192,
              Path('assets/mova-app-icon-512.png'): 512,
          }
          for path, size in outputs.items():
              render(size).save(path, 'PNG', optimize=True)

          render(256).save('favicon.ico', format='ICO', sizes=[
              (16,16), (32,32), (48,48), (64,64), (128,128), (256,256)
          ])
          PY

      - name: Wire new wordmark, mobile icon, browser favicon and app icon
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'assets/MOVA-approved-MTrading-logo.png': 'assets/MOVA-NEW-Iconword-W-logo.svg?v=180',
              '/assets/MOVA-approved-MTrading-logo.png': '/assets/MOVA-NEW-Iconword-W-logo.svg?v=180',
              'assets/MOVA-header-wordmark-text-only-transparent-FIXED.png': 'assets/MOVA-NEW-Iconword-W-logo.svg?v=180',
              '/assets/MOVA-header-wordmark-text-only-transparent-FIXED.png': '/assets/MOVA-NEW-Iconword-W-logo.svg?v=180',
              'assets/MOVA-M-prem-icon.png': 'assets/MOVA-QIcon-logo.svg?v=180',
              '/assets/MOVA-M-prem-icon.png': '/assets/MOVA-QIcon-logo.svg?v=180',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          s = re.sub(
              r'\s*<link\b[^>]*\brel=["\'](?:shortcut\s+icon|icon|apple-touch-icon)["\'][^>]*>',
              '', s, flags=re.I,
          )
          favicon_links = '\n  <link rel="icon" type="image/svg+xml" href="/assets/MOVA-QIcon-logo.svg?v=180">\n  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64x64.png?v=180">\n  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png?v=180">\n  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png?v=180">\n  <link rel="shortcut icon" href="/favicon.ico?v=180">\n  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=180">\n'
          if '</head>' not in s:
              raise SystemExit('index.html has no </head> tag')
          s = s.replace('</head>', favicon_links + '</head>', 1)

          s = re.sub(r'<!-- MOVA BUILD v\d+[^>]*-->', '<!-- MOVA BUILD v180 NEW BRAND SYSTEM -->', s, count=1)
          s = re.sub(r'data-mova-build="[^"]+"', 'data-mova-build="v180-new-brand-system"', s, count=1)
          p.write_text(s, encoding='utf-8')

          manifest_path = Path('manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['background_color'] = '#000000'
          manifest['theme_color'] = '#000000'
          manifest['icons'] = [
              {'src':'assets/mova-app-icon-192.png?v=180','sizes':'192x192','type':'image/png','purpose':'any maskable'},
              {'src':'assets/mova-app-icon-512.png?v=180','sizes':'512x512','type':'image/png','purpose':'any maskable'}
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit MOVA v180 branding
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            index.html \
            manifest.webmanifest \
            favicon.ico \
            assets/favicon-16x16.png \
            assets/favicon-32x32.png \
            assets/favicon-64x64.png \
            assets/apple-touch-icon.png \
            assets/mova-app-icon-192.png \
            assets/mova-app-icon-512.png
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Apply MOVA v180 desktop and mobile branding"
            git push origin main
          fi
