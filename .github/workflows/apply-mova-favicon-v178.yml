name: Apply MOVA favicon v178

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-mova-favicon-v178.yml'

permissions:
  contents: write

jobs:
  apply-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point MOVA to the new favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link rel="icon" href="/assets/icons/favicon\.ico\?v=\d+" sizes="any">','<link rel="icon" type="image/svg+xml" href="/assets/icons/mova-favicon-v178.svg?v=178">',s,count=1)
          s=re.sub(r'<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/[^"]+">','',s,count=1)
          s=re.sub(r'<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/[^"]+">','',s,count=1)
          s=re.sub(r'<!-- MOVA BUILD v\d+[^>]*-->','<!-- MOVA BUILD v178 REDESIGNED FAVICON -->',s,count=1)
          s=re.sub(r'data-mova-build="[^"]+"','data-mova-build="v178-redesigned-favicon"',s,count=1)
          if '/assets/icons/mova-favicon-v178.svg?v=178' not in s:
              raise SystemExit('new favicon reference missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit favicon wiring
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Wire redesigned MOVA favicon"
            git push origin main
          fi
