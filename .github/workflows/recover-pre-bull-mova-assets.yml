name: Install approved MOVA assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recover-pre-bull-mova-assets.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install approved assets
        run: |
          cp mova-recovered-app-icon.png mova-approved-icon.png
          cp mova-recovered-wordmark.png mova-approved-wordmark.png
          python scripts/install_approved_mova_branding.py
      - name: Commit changes
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html mova-approved-icon.png mova-approved-wordmark.png
          git commit -m "Install approved MOVA branding assets"
          git push origin main
