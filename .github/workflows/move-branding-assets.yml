name: Move MOVA branding assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/move-branding-assets.yml'

permissions:
  contents: write

jobs:
  tidy-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move wordmark assets into assets/branding
        run: |
          mkdir -p assets/branding
          test -f MOVA-wordmarklogo.png
          test -f MOVA-wordmarklogo-display.png
          git mv MOVA-wordmarklogo.png assets/branding/MOVA-wordmarklogo.png
          git mv MOVA-wordmarklogo-display.png assets/branding/MOVA-wordmarklogo-display.png

          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('MOVA-wordmarklogo-display.png?v=162','/assets/branding/MOVA-wordmarklogo-display.png?v=171')
          s=s.replace('MOVA-wordmarklogo.png?v=159','/assets/branding/MOVA-wordmarklogo.png?v=171')
          s=s.replace('MOVA-wordmarklogo.png?v=156','/assets/branding/MOVA-wordmarklogo.png?v=171')
          s=s.replace('MOVA-wordmarklogo.png?v=158','/assets/branding/MOVA-wordmarklogo.png?v=171')
          s=s.replace('<!-- MOVA BUILD v170 ICON ASSETS FOLDER -->','<!-- MOVA BUILD v171 ORGANIZED BRAND ASSETS -->')
          s=s.replace('data-mova-build="v170-icon-assets-folder"','data-mova-build="v171-organized-brand-assets"')

          if '/assets/branding/MOVA-wordmarklogo-display.png?v=171' not in s:
              raise SystemExit('Active display wordmark reference was not updated')
          if 'src="MOVA-wordmarklogo-display.png' in s:
              raise SystemExit('Old root wordmark reference still present')

          p.write_text(s,encoding='utf-8')
          PY

          rm .github/workflows/move-branding-assets.yml

      - name: Commit tidy branding structure
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Move MOVA wordmark assets into branding folder"
          git push origin main
