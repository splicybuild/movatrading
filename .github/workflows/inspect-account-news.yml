name: Inspect account and news
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Inspect account/news output
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('dist/index.html').read_text()
          needles=['function openAccount()','function openMobileAuth','function getMobileProfile','function saveMobileProfile','function createMobile','mobileCreate','localStorage.setItem','function loadNews','function resetNews','function renderNews','newsGrid','/api/news']
          for needle in needles:
              print('\n===',needle,'===')
              start=0;count=0
              while count<5:
                  i=s.find(needle,start)
                  if i<0: break
                  print('index',i)
                  print(s[max(0,i-700):i+1800])
                  start=i+len(needle);count+=1
          PY
