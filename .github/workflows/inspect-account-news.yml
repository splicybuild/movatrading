name: Inspect account and news
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Inspect account/news output
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('dist/index.html').read_text()
          for needle in ['function openAccount()','Top 10 market stories','movaOpenAccountWorkspaceV2','movaTopNewsRestored','NEWS & ALERTS','News & Alerts']:
              print('\n===',needle,'===')
              i=s.find(needle)
              print('index',i)
              if i>=0: print(s[max(0,i-900):i+2200])
          PY
