name: Clean MOVA branding

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-single-mova-wordmark.yml'

permissions:
  contents: write

jobs:
  clean-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate MOVA branding in index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove obsolete header/icon rules that were added during later logo experiments.
          exact_rules = [
              '.brand{display:flex;align-items:center;gap:12px}\n.brand-app-icon{width:58px;height:58px;object-fit:cover;border-radius:14px;flex:0 0 58px;box-shadow:0 0 0 1px rgba(98,200,255,.14)}\n.brand-wordmark{min-width:0}\n',
              '  .brand{gap:8px;width:100%}\n  .brand-app-icon{width:44px;height:44px;flex-basis:44px;border-radius:11px}\n  .brand-wordmark{max-width:calc(100% - 52px)!important}\n',
          ]
          for rule in exact_rules:
              text = text.replace(rule, '')

          legacy_blocks = [
          '''/* v147 approved MOVA black/electric-blue horned M branding */
          .brand{justify-content:flex-start!important;width:auto!important;gap:12px!important}
          .brand-app-icon{width:64px!important;height:64px!important;object-fit:contain!important;border-radius:0!important;box-shadow:none!important}
          .mova-brand-copy{display:flex;flex-direction:column;line-height:1;min-width:max-content}
          .mova-brand-copy strong{font-size:25px;letter-spacing:.28em;font-weight:850;color:#fff}
          .mova-brand-copy span{margin-top:7px;font-size:10px;letter-spacing:.46em;font-weight:900;color:#62c8ff}
          @media(max-width:800px){
           .brand{justify-content:center!important}
           .brand-app-icon{width:48px!important;height:48px!important}
           .mova-brand-copy{display:none!important}
          }

          ''',
          '''/* v149 corrected branding — preserve original MOVA TRADING wordmark; remove only duplicate text */
          .brand{justify-content:flex-start!important;width:auto!important;gap:16px!important}
          .brand-app-icon{width:82px!important;height:82px!important;object-fit:contain!important;border-radius:0!important;box-shadow:none!important;flex:0 0 auto!important}
          .brand-wordmark{display:block!important;height:44px!important;width:auto!important;max-width:min(42vw,520px)!important;object-fit:contain!important;margin:0!important}
          .mova-brand-copy{display:none!important}
          @media(max-width:800px){
           .brand{justify-content:center!important;gap:0!important}
           .brand-app-icon{width:62px!important;height:62px!important}
           .brand-wordmark{display:none!important}
          }
          ''',
          '''/* v151 single MOVA wordmark restored */
          .brand{justify-content:center!important;width:100%!important;gap:0!important}
          .brand-app-icon{display:none!important}
          .brand-wordmark{display:block!important;height:44px!important;width:auto!important;max-width:min(86vw,620px)!important;object-fit:contain!important;margin:0 auto!important}
          @media(max-width:800px){.brand{justify-content:center!important;width:100%!important;gap:0!important}.brand-wordmark{display:block!important;height:44px!important;max-width:min(86vw,620px)!important;margin:0 auto!important}}

          ''',
          '''/* v152 original MOVA wordmark on desktop + mobile app */
          .brand{justify-content:center!important;width:100%!important;gap:0!important}
          .brand-app-icon{display:none!important}
          .brand-wordmark{display:block!important;height:44px!important;width:auto!important;max-width:min(86vw,620px)!important;object-fit:contain!important;margin:0 auto!important}
          @media(max-width:800px){
            .brand{justify-content:center!important;width:100%!important;gap:0!important}
            .brand-wordmark{display:block!important;height:44px!important;max-width:min(86vw,620px)!important;margin:0 auto!important}
            body.mova-mobile-welcome .mobile-auth-brand{display:flex!important;flex-direction:column!important;align-items:center!important}
            body.mova-mobile-welcome .mobile-auth-brand>.label{order:1!important;margin:0 0 10px!important}
            body.mova-mobile-welcome .mobile-auth-logo{order:2!important;display:block!important;width:min(86vw,340px)!important;max-width:340px!important;height:auto!important;object-fit:contain!important;border-radius:0!important;margin:0 auto 10px!important;box-shadow:none!important}
            body.mova-mobile-welcome .mobile-auth-full-brand{display:none!important}
            body.mova-mobile-welcome .mobile-auth-tagline{order:3!important}
          }

          ''',
          ]
          for block in legacy_blocks:
              text = text.replace(block, '')

          # Remove any separate experimental icon from the header if one is ever reintroduced.
          text = re.sub(r'\s*<img[^>]*class=["\'][^"\']*brand-app-icon[^"\']*["\'][^>]*?/?>\s*', '\n', text, flags=re.I)

          # The approved wordmark is already embedded as the brand-wordmark data URI. Keep it.
          if 'class="brand-wordmark"' not in text or 'data:image/png;base64,' not in text:
              raise SystemExit('Approved embedded MOVA wordmark was not found; refusing to replace it.')

          # Remove duplicated textual MOVA TRADING from the mobile welcome card; the image wordmark is the brand.
          text = text.replace('        <div class="mobile-auth-full-brand">MOVA <span>TRADING</span></div>\n', '')

          canonical_css = '''
          /* v153 CANONICAL MOVA BRANDING — one wordmark, desktop + mobile */
          header .brand{
            display:flex!important;
            align-items:center!important;
            justify-content:center!important;
            width:100%!important;
            gap:0!important;
          }
          header .brand-app-icon,
          header .mova-brand-copy{display:none!important}
          header .brand-wordmark{
            display:block!important;
            height:58px!important;
            width:auto!important;
            max-width:min(82vw,520px)!important;
            object-fit:contain!important;
            margin:0 auto!important;
          }
          @media(max-width:800px){
            header .brand{justify-content:center!important;width:100%!important;gap:0!important}
            header .brand-wordmark{
              display:block!important;
              height:47px!important;
              width:auto!important;
              max-width:78vw!important;
              object-fit:contain!important;
              margin:0 auto!important;
            }
            body.mova-mobile-welcome .mobile-auth-brand{
              display:flex!important;
              flex-direction:column!important;
              align-items:center!important;
            }
            body.mova-mobile-welcome .mobile-auth-brand>.label{
              order:1!important;
              margin:0 0 10px!important;
            }
            body.mova-mobile-welcome .mobile-auth-logo{
              order:2!important;
              display:block!important;
              width:min(86vw,340px)!important;
              max-width:340px!important;
              height:auto!important;
              object-fit:contain!important;
              border-radius:0!important;
              margin:0 auto 10px!important;
              box-shadow:none!important;
            }
            body.mova-mobile-welcome .mobile-auth-full-brand{display:none!important}
            body.mova-mobile-welcome .mobile-auth-tagline{order:3!important}
          }
          '''

          # Guarantee exactly one canonical branding block.
          text = re.sub(r'\n\s*/\* v153 CANONICAL MOVA BRANDING.*?(?=\n\s*</style>)', '', text, flags=re.S)
          pos = text.rfind('</style>')
          if pos < 0:
              raise SystemExit('No closing style tag found')
          text = text[:pos] + canonical_css + '\n' + text[pos:]

          # Mobile welcome must source the same embedded wordmark.
          text = text.replace('const source=document.querySelector(".brand-app-icon");', 'const source=document.querySelector(".brand-wordmark");')

          # Update the visible build marker so the deployed source is easy to verify.
          text = re.sub(r'<!-- MOVA BUILD v\d+[^>]*-->', '<!-- MOVA BUILD v153 CANONICAL WORDMARK CLEANUP -->', text, count=1)
          text = re.sub(r'data-mova-build="[^"]+"', 'data-mova-build="v153-canonical-wordmark"', text, count=1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleaned index
        run: |
          git config user.name "mova-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Clean conflicting MOVA branding rules"
          git push origin main
